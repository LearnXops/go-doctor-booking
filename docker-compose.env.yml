version: '3.8'

services:
  # Database service
  db:
    image: postgres:13-alpine
    container_name: doctor_booking_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT_EXPOSE}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Backend service
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doctor_booking_api
    ports:
      - "${API_PORT_EXPOSE}:8080"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_PORT=${DB_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - ENV=${ENV}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/docs:/app/docs
    restart: unless-stopped
    networks:
      - app-network

  # Frontend Production
  frontend-prod:
    build:
      context: ./frontend
      target: production
    container_name: doctor_booking_frontend_prod
    ports:
      - "${FRONTEND_PROD_PORT}:80"
    environment:
      - NODE_ENV=${NODE_ENV_PROD}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL_PROD}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network

  # Frontend Development
  frontend-dev:
    build:
      context: ./frontend
      target: development
    container_name: doctor_booking_frontend_dev
    ports:
      - "${FRONTEND_DEV_PORT}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/dist
    environment:
      - NODE_ENV=${NODE_ENV_DEV}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL_DEV}
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
